<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080a0b" />
    <title>Hors connexion — ZeControl</title>
    <style>
      :root { color-scheme: light; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; min-height: 100dvh; margin: 0; padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom)); display: grid; place-items: center; color: #17333c; background: radial-gradient(circle at 50% 18%, #d9f4ef, transparent 32%), #f4f1e9; }
      main { width: min(420px, 100%); padding: 34px 28px; border: 1px solid rgba(8,10,11,.08); border-radius: 28px; background: rgba(255,255,255,.9); box-shadow: 0 26px 70px rgba(8,10,11,.12); text-align: center; }
      .mark { width: 70px; height: 70px; margin: 0 auto 24px; display: grid; place-items: center; position: relative; border-radius: 22px; background: linear-gradient(145deg, #18b8aa, #087e83); box-shadow: 0 14px 30px rgba(8,126,131,.24); transform: rotate(-3deg); }
      .ring { width: 44px; height: 44px; border: 4px solid rgba(255,255,255,.92); border-radius: 50%; }
      .hand { width: 4px; height: 19px; position: absolute; left: 34px; top: 18px; border-radius: 99px; background: #fff; transform: rotate(24deg); transform-origin: 2px 17px; }
      .dot { width: 11px; height: 11px; position: absolute; right: 5px; bottom: 7px; border: 3px solid #fff; border-radius: 50%; background: #ffcf69; }
      h1 { margin: 0; color: #080a0b; font-size: clamp(28px, 8vw, 38px); letter-spacing: -.045em; }
      p { margin: 13px auto 0; color: #64777c; font-size: 15px; line-height: 1.55; }
      button { width: 100%; min-height: 52px; margin-top: 26px; border: 0; border-radius: 999px; color: #fff; background: #080a0b; font: inherit; font-weight: 800; cursor: pointer; }
      small { margin-top: 16px; display: block; color: #8a999d; font-size: 11px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true"><span class="ring"></span><span class="hand"></span><span class="dot"></span></div>
      <h1>Vous êtes hors connexion</h1>
      <p>ZeControl doit joindre le serveur pour garantir l’heure et la fiabilité de votre pointage.</p>
      <button type="button" onclick="window.location.reload()">Réessayer</button>
      <small>Aucun pointage n’est enregistré hors connexion.</small>
    </main>
    <script>
      window.addEventListener("online", function () {
        window.location.reload();
      });
    </script>
  </body>
</html>
